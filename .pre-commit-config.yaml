repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        # MkDocs intentionally uses a Python constructor tag for SuperFences;
        # validate that file with `mkdocs build --strict` instead.
        exclude: ^itambox/mkdocs\.yml$
      - id: check-added-large-files

  # Canonical formatter and import sorter. Keep this revision synchronized with
  # the exact Ruff version in pyproject.toml/uv.lock so local hooks match CI.
  # Import sorting runs before formatting; Flake8 remains the semantic gate.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.20
    hooks:
      - id: ruff-check
        name: ruff (import sort)
        args: [--select, I, --fix]
      - id: ruff-format

  # Managed, pinned environment so missing Bugbear or diagnostic dependency
  # drift cannot silently weaken the policy relative to Linux CI.
  - repo: https://github.com/pycqa/flake8
    rev: 7.0.0
    hooks:
      - id: flake8
        alias: flake8-baseline
        name: flake8 (blocking baseline gate)
        entry: python scripts/check_flake8_baseline.py
        # The identity baseline is interpreter-specific; keep local hooks on
        # the same canonical interpreter as CI and Docker.
        language_version: python3.12
        additional_dependencies:
          - flake8-bugbear==24.12.12
          - mccabe==0.7.0
          - pycodestyle==2.11.1
          - pyflakes==3.2.0
        pass_filenames: false
        always_run: true

  # Deterministic AST gate for function-body imports (see
  # itambox/docs/development/python-import-policy.md). Stdlib-only, so it needs
  # no managed environment beyond the canonical interpreter the baseline was
  # generated with.
  - repo: local
    hooks:
      - id: local-import-policy
        name: local imports (blocking policy gate)
        entry: python scripts/check_local_imports.py
        language: python
        language_version: python3.12
        pass_filenames: false
        always_run: true
      # Whole-graph analysis, so it cannot take filenames: a per-file
      # invocation would build a different graph on every commit and report
      # different findings each time.
      - id: architecture-policy
        name: architecture boundaries (blocking policy gate)
        entry: python scripts/check_architecture.py
        language: python
        language_version: python3.12
        pass_filenames: false
        always_run: true
      - id: exception-policy
        name: exception handlers (blocking policy gate)
        entry: python scripts/check_exception_policy.py
        language: python
        language_version: python3.12
        pass_filenames: false
        always_run: true
      - id: inline-style-policy
        name: CSP inline styles (blocking policy gate)
        entry: uv run --locked --group dev python scripts/check_inline_styles.py
        language: system
        pass_filenames: false
        always_run: true
      # Full-repository template gate. It is deliberately check-only: the
      # separate make format-templates target owns intentional rewrites.
      - id: djlint
        name: djLint (blocking template gate)
        entry: uv run --locked --group dev python scripts/lint_templates.py --check --lint --statistics
        language: system
        pass_filenames: false
        always_run: true
      # Full authored CSS/SCSS gate. Stylelint fixes are deliberately separate
      # from the mandatory hook so commits cannot rewrite files implicitly.
      - id: stylelint
        name: Stylelint (blocking authored-style gate)
        entry: bash -c 'cd itambox && npm run lint:styles'
        language: system
        pass_filenames: false
        always_run: true
