{% load i18n %}
{% translate "Active" as active_label %}
<dl class="row mb-0">
  <dt class="col-sm-3">{% translate "Name:" %}</dt>
  <dd class="col-sm-9">
    <strong>{{ object.name }}</strong>
  </dd>
  <dt class="col-sm-3">{% translate "Status:" %}</dt>
  <dd class="col-sm-9">
    {{ object.get_status_display|default:active_label }}
  </dd>
</dl>
