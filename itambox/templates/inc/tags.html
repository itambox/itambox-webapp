{% load utility_tags %}
{% if tag %}
  {% csp_color_style tag.color|default:'6c757d' "chip" as tag_style %}
  {{ tag_style.style_block|safe }}
  <span class="badge shadow-sm tag-chip {{ tag_style.class_name }} {% if tag.color == 'ffffff' or tag.color == 'FFFFFF' %}color-chip-text-dark tag-chip-light{% else %}color-chip-text-light{% endif %}"
        title="{{ tag.description|default:tag.name }}">{{ tag.name }}</span>
{% endif %}
