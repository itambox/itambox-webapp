[project]
name = "itambox"
version = "1.0.0-alpha.2"
description = "IT Asset Management System inspired by NetBox"
requires-python = ">=3.12"
# NOTE: ITAMbox is NOT pip-installable and does not ship wheels/sdists. The apps
# are top-level packages (core, organization, assets, ...) rooted in itambox/ —
# packaging them would install a package literally named `core` into
# site-packages. The supported deployment paths are Docker (see Dockerfile /
# docker-compose.yml) and a checkout synchronized from uv.lock. This table is
# the only source of direct runtime dependency policy; uv.lock records the exact
# cross-platform resolution used by Docker, CI, and contributors.
dependencies = [
    "Django>=5.2,<5.3",
    "djangorestframework>=3.17.1,<3.18",
    "drf-spectacular[sidecar]>=0.29,<0.30",
    "django-tables2>=3.0.0,<3.1",
    "django-filter>=25.2,<26.2",
    "django-htmx>=1.21,<1.29",
    "django-template-partials>=25.3,<25.4",
    "django-crispy-forms>=2.6,<2.7",
    "crispy-bootstrap5>=2026.3,<2027",
    "django-taggit>=6.1,<6.2",
    "django-q2>=1.7,<2.0",
    "sqlparse>=0.5.4,<0.6.0",
    "croniter>=6.0,<7.0",
    "python-dateutil>=2.9,<3.0",
    "graphene-django>=3.2,<3.3",
    "graphene>=3.3,<4.0",
    "django-otp>=1.4,<1.8",
    # Excluded on native Windows: pulls python-ldap, which has no Windows binary
    # wheel and fails to build there. Docker/Linux/WSL images are unaffected.
    "django-auth-ldap>=5.1,<6.0; platform_system != \"Windows\"",
    "djangosaml2>=1.12.0,<2.0",
    "mozilla-django-oidc>=5.0.2,<6.0.0",
    "pyOpenSSL>=24.3,<27",
    "django-cors-headers>=4.9.0,<5.0",
    "requests>=2.31,<3.0",
    "gunicorn>=26.0.0,<27.0",
    "whitenoise>=6.6,<7.0",
    "psycopg2-binary>=2.9.12,<3.0",
    "django-redis>=5.4,<6.0",
    "redis>=8.0.1,<9.0",
    "Pillow>=12.3.0,<13.0",
    # Excluded on native Windows because importing without a usable libmagic DLL
    # can hang. Docker/Linux/WSL retain full MIME signature validation.
    "python-magic>=0.4.27,<0.5; platform_system != \"Windows\"",
    "segno>=1.6,<2.0",
    "python-barcode>=0.15,<1.0",
    "markdown>=3.10,<3.11",
    "Jinja2>=3.1,<4.0",
    "html5lib>=1.1,<2.0",
    "tinycss2>=1.5,<2.0",
    "xhtml2pdf>=0.2.17,<0.3",
    "svglib>=2.0.2,<2.1",
    "openpyxl>=3.1,<3.2",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3,<10.0",
    "pytest-django>=4.8,<5.0",
    "pytest-cov>=5.0,<6.0",
    "pytest-xdist>=3.5,<4.0",
    "model-bakery>=1.17,<2.0",
    "factory_boy>=3.3,<4.0",
    "tblib>=3.0,<4.0",
    "django-debug-toolbar>=4.4,<5.0",
    # Exact versions: scripts/flake8_baseline.json is diagnostic-version-bound.
    "flake8==7.0.0",
    "flake8-bugbear==24.12.12",
    "mccabe==0.7.0",
    "pycodestyle==2.11.1",
    "pyflakes==3.2.0",
    "pre-commit>=4.0,<5.0",
    "djlint==1.43.2",
    "PyYAML>=6.0,<7.0",
    # Exact version: formatting/import-sort output must be reproducible across
    # contributors, pre-commit, and CI (see pyproject.toml [tool.ruff]).
    "ruff==0.15.20",
]
docs = [
    "mkdocs>=1.6.1,<2.0",
    "mkdocs-material>=9.5",
]

[tool.uv]
package = false
required-version = "==0.11.31"

# No [build-system] / setuptools packaging on purpose: uv synchronizes the
# declared dependencies but never installs the checkout as a package.

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "core.settings"
python_files = ["tests.py", "test_*.py"]
# Fast by default: reuse the test DB across runs (stable name set in conftest), so the
# ~200 migrations aren't rebuilt every run. Coverage is NOT measured by default (it
# ~3x's a run); pass `--cov=. --cov-report=html` explicitly, or run the CI job.
#
# pytest-xdist is installed but NOT enabled by default: the suite is not yet xdist-safe
# (cross-test shared state — MEDIA_ROOT, requests-mock + django-q timing — makes a
# handful of tests fail non-deterministically under `-n auto`). Once those are isolated
# (per-worker MEDIA_ROOT, etc.) add `-n auto` here. Until then run `-n auto` ad hoc when
# you know the targeted subset is parallel-clean.
addopts = ["--tb=short", "-p", "no:warnings", "--reuse-db", "--no-cov-on-fail"]
norecursedirs = [".venv", "scratch", "node_modules", ".git", ".agents", ".*"]

[tool.coverage.run]
# Branch coverage is measured, not just line coverage: a partially-taken `if`
# is the shape most tenancy/permission regressions hide in, and line coverage
# alone reports such a branch as fully covered. Both rates are recorded and
# ratcheted by scripts/check_coverage_baseline.py.
branch = true
source = ["."]
# Store measured paths relative to the run directory (itambox/). Absolute paths
# are machine- and OS-specific, which would make coverage.json unusable for the
# differential gate and incomparable between a contributor's run and CI's.
relative_files = true
# Exclusion policy: generated code, test code, and process entry points only --
# never hand-written application code. Every entry below must stay justifiable
# on its own; this list is the reviewable record of what is NOT measured.
omit = [
    # Generated by `makemigrations`, never hand-written (see CLAUDE.md).
    "*/migrations/*",
    # Test code measures the application, not itself.
    "*/tests/*",
    "*/tests.py",
    "*/conftest.py",
    # Process entry points: exercised by deployment/smoke jobs, not unit tests.
    "manage.py",
    "core/wsgi.py",
    "core/asgi.py",
    "itambox/wsgi.py",
    "itambox/asgi.py",
]

[tool.coverage.report]
# Coarse floor only -- NOT the ratchet. The authoritative, reviewed gate is the
# identity baseline in scripts/coverage_baseline.json enforced by
# scripts/check_coverage_baseline.py, which holds both line and branch rates to
# the recorded values. This number exists so an ad-hoc local `pytest --cov` run
# still fails loudly on a catastrophic drop; the gate refuses to run if this
# floor is ever raised above the measured combined rate, since a floor above
# what the suite achieves fails every run and therefore enforces nothing.
#
# coverage.py compares this against the COMBINED line+branch percentage. The old
# value of 45 was calibrated against a measurement that never applied this file
# (see --cov-config in the Makefile): it counted generated migrations and test
# modules as covered source and reported ~86%, so the floor was unreachable in
# principle and unenforced in practice.
fail_under = 70
show_missing = true
# Line-level exclusions: unreachable-by-design or import-time-only boilerplate.
# Keep this list short and specific -- each pattern hides real lines from the
# ratchet, so anything with behaviour belongs in a test instead.
exclude_also = [
    # Import-time-only block; contains no runtime behaviour.
    "if TYPE_CHECKING:",
    # Abstract contract markers -- the subclass implementations are measured.
    "raise NotImplementedError",
    "@(abc\\.)?abstractmethod",
    # Script entry points; the callable body above them is measured.
    "if __name__ == .__main__.:",
]

[tool.coverage.json]
# The differential gate needs per-file line/branch detail, not just totals.
show_contexts = false

[tool.ruff]
# Canonical formatter and import sorter (see issue #87). Ruff owns formatting
# and import order only; Flake8 (setup.cfg) remains the semantic lint gate --
# this section deliberately does not enable Ruff's own semantic rule sets.
line-length = 120
target-version = "py312"
# Two independent import roots: itambox/ (Django project root -- apps import
# each other by bare name, e.g. `from organization.models import Tenant`) and
# the repo root (scripts/ is imported as a top-level package, e.g.
# `from scripts.release_policy import ...`).
src = ["itambox", "."]
# Generated/dependency/vendor paths only -- never hand-written app code.
# .git, __pycache__, .venv, venv, node_modules, and dist are already covered
# by Ruff's built-in default excludes.
extend-exclude = [
    "*/migrations/*",
    "itambox/static/dist",
    "itambox/static/docs",
]

[tool.ruff.format]
line-ending = "lf"

[tool.ruff.lint]
# Import-order enforcement only. No pycodestyle/pyflakes/bugbear rules here --
# those stay on the Flake8 identity baseline (scripts/flake8_baseline.json) so
# this phase introduces no new semantic gate or rule weakening.
select = ["I"]

# Template lint policy (issue #94). The profile stays fail-closed for authored
# template syntax, structure, and formatting. H005/H016/H030 cover the
# accessibility/SEO scope owned by #101; H021 covers inline-style/CSP debt owned
# by #24. These are explicit scope boundaries, not a debt baseline.
[tool.djlint]
profile = "django"
use_gitignore = true
ignore = "H005,H016,H021,H030"
# django-template-partials uses the non-conventional startpartial/endpartial
# pair. The formatter understands the opening shape; T038 is ignored only in
# the exact 13 files using that third-party pair (see per-file-ignores below).
custom_blocks = "{% startpartial %}...{% endpartial %}"

[tool.djlint.per-file-ignores]
"itambox/compliance/templates/compliance/audits/audit_session_flag_missing.html" = "T038"
"itambox/inventory/templates/inventory/includes/accessory_checkout_modal.html" = "T038"
"itambox/inventory/templates/inventory/includes/component_checkout_modal.html" = "T038"
"itambox/inventory/templates/inventory/includes/consumable_checkout_modal.html" = "T038"
"itambox/inventory/templates/inventory/includes/kit_checkout_modal.html" = "T038"
"itambox/templates/assets/includes/asset_audit_modal.html" = "T038"
"itambox/templates/assets/includes/asset_checkin_modal.html" = "T038"
"itambox/templates/assets/includes/asset_checkout_modal.html" = "T038"
"itambox/templates/generic/includes/add_stock_modal.html" = "T038"
"itambox/templates/licenses/includes/license_checkout_modal.html" = "T038"
"itambox/templates/subscriptions/includes/subscription_cancel_modal.html" = "T038"
"itambox/templates/subscriptions/includes/subscription_checkout_modal.html" = "T038"
"itambox/templates/subscriptions/includes/subscription_renew_modal.html" = "T038"
