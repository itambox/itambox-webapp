name: E2E (Playwright)

on:
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    services:
      postgres:
        image: postgres:16@sha256:33f923b05f64ca54ac4401c01126a6b92afe839a0aa0a52bc5aeb5cc958e5f20
        env:
          POSTGRES_DB: itambox_e2e
          POSTGRES_USER: itambox_e2e
          POSTGRES_PASSWORD: itambox_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready --host=127.0.0.1 --port=5432 --username=itambox_e2e --dbname=itambox_e2e"
          --health-interval=2s
          --health-timeout=2s
          --health-retries=30
      oidc:
        image: ghcr.io/navikt/mock-oauth2-server:6.0.0@sha256:b9fa251aefee22a97c32534d23a1c400f01dbd483ab263b013d89f6d60d96691
        env:
          JSON_CONFIG: >-
            {"interactiveLogin":true,"httpServer":"NettyWrapper","tokenProvider":{"keyProvider":{"algorithm":"RS256"}},"tokenCallbacks":[{"issuerId":"itambox-e2e","tokenExpiry":300,"requestMappings":[{"requestParam":"subject","match":"itambox-e2e-oidc-user","claims":{"sub":"itambox-e2e-oidc-user","email":"e2e.oidc@itambox.local","given_name":"E2E","family_name":"OIDC","groups":["e2e-oidc-admins"],"aud":["${clientId}"],"azp":"${clientId}"}}]}]}
        ports:
          - 8081:8080

    env:
      ITAMBOX_ENV: dev
      ITAMBOX_DB_NAME: itambox_e2e
      ITAMBOX_DB_USER: itambox_e2e
      ITAMBOX_DB_PASSWORD: itambox_e2e
      ITAMBOX_DB_HOST: localhost
      ITAMBOX_DB_PORT: "5432"
      ITAMBOX_DB_SSLMODE: disable
      DJANGO_SUPERUSER_USERNAME: e2e-admin
      DJANGO_SUPERUSER_EMAIL: e2e@itambox.local
      E2E_USERNAME: e2e-admin
      E2E_TENANT_SLUG: helix-rnd
      E2E_ISOLATION_TENANT_SLUG: e2e-isolation-tenant
      E2E_TENANT_GROUP_NAME: E2E Tenant Read-Only Group
      E2E_BASE_URL: http://localhost:8000
      E2E_OIDC_PROVIDER_URL: http://127.0.0.1:8081
      E2E_OIDC_SUBJECT: itambox-e2e-oidc-user
      E2E_OIDC_EMAIL: e2e.oidc@itambox.local
      ITAMBOX_TENANT_OIDC_CONFIGS: >-
        {"helix-rnd":{"enabled":true,"display_name":"E2E OIDC","OIDC_RP_CLIENT_ID":"itambox-e2e-client","OIDC_RP_CLIENT_SECRET":"itambox-e2e-secret","OIDC_OP_AUTHORIZATION_ENDPOINT":"http://127.0.0.1:8081/itambox-e2e/authorize","OIDC_OP_TOKEN_ENDPOINT":"http://127.0.0.1:8081/itambox-e2e/token","OIDC_OP_USER_ENDPOINT":"http://127.0.0.1:8081/itambox-e2e/userinfo","OIDC_OP_ISSUER":"http://127.0.0.1:8081/itambox-e2e","OIDC_OP_JWKS_ENDPOINT":"http://127.0.0.1:8081/itambox-e2e/jwks","OIDC_RP_SIGN_ALGO":"RS256","OIDC_RP_SCOPES":"openid email profile groups","OIDC_USE_NONCE":true,"OIDC_CREATE_USER":true,"OIDC_GROUP_ROLE_MAPPING":{"e2e-oidc-admins":"Admin"}}}
      # Playwright's webServer config uses a venv path; in CI we manage the server
      # ourselves for reliability and to avoid venv path assumptions.
      E2E_NO_WEBSERVER: "1"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.31"
          enable-cache: true
          cache-dependency-glob: uv.lock

      # python-ldap (pulled by django-auth-ldap) needs libldap2/sasl headers for
      # source builds on Ubuntu runners.
      - name: Install system deps for python-ldap
        run: |
          if command -v apt-get >/dev/null; then
            if [ "$(id -u)" -eq 0 ]; then
              apt-get update
              apt-get install -y --no-install-recommends \
                gcc \
                libmagic1 \
                libldap2-dev \
                libsasl2-dev \
                libssl-dev \
                xmlsec1
            else
              sudo apt-get update
              sudo apt-get install -y --no-install-recommends \
                gcc \
                libmagic1 \
                libldap2-dev \
                libsasl2-dev \
                libssl-dev \
                xmlsec1
            fi
          fi

      - name: Install Python dependencies
        run: |
          uv lock --check
          uv sync --locked --group dev

      - name: Set up Node.js 20
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "20"
          cache: 'npm'
          cache-dependency-path: itambox/package-lock.json

      - name: Install frontend dependencies
        working-directory: ./itambox
        run: npm ci

      - name: Build frontend assets
        working-directory: ./itambox
        run: npm run build:all

      - name: Install E2E dependencies
        working-directory: ./itambox/tests/e2e
        run: npm ci

      - name: Configure ephemeral Playwright browser path
        run: echo "PLAYWRIGHT_BROWSERS_PATH=${RUNNER_TEMP}/ms-playwright" >> "$GITHUB_ENV"

      - name: Install Playwright browsers
        working-directory: ./itambox/tests/e2e
        run: npx playwright install --with-deps chromium

      - name: Check OIDC mock provider readiness
        env:
          E2E_OIDC_PROVIDER_URL: ${{ env.E2E_OIDC_PROVIDER_URL }}
        run: |
          set -Eeuo pipefail
          provider_url="$E2E_OIDC_PROVIDER_URL"
          alive_url="${provider_url}/isalive"
          discovery_url="${provider_url}/itambox-e2e/.well-known/openid-configuration"
          jwks_url="${provider_url}/itambox-e2e/jwks"
          discovery_path="${RUNNER_TEMP}/oidc-discovery.json"
          jwks_path="${RUNNER_TEMP}/oidc-jwks.json"
          deadline=$((SECONDS + 60))
          attempt=0
          live=false

          while (( SECONDS < deadline && attempt < 60 )); do
            attempt=$((attempt + 1))
            if curl --fail --silent --show-error --max-time 5 "$alive_url" >/dev/null 2>/dev/null; then
              live=true
              break
            fi
            sleep 1
          done
          if [[ "$live" != true ]]; then
            echo "OIDC mock provider did not become live within the bounded readiness window."
            exit 1
          fi

          curl --fail --silent --show-error --max-time 10 "$discovery_url" > "$discovery_path"
          curl --fail --silent --show-error --max-time 10 "$jwks_url" > "$jwks_path"
          E2E_OIDC_PROVIDER_URL="$provider_url" DISCOVERY_PATH="$discovery_path" JWKS_PATH="$jwks_path" python - <<'PY'
          import json
          import os
          from pathlib import Path

          provider_url = os.environ["E2E_OIDC_PROVIDER_URL"]
          expected = {
              "issuer": f"{provider_url}/itambox-e2e",
              "authorization_endpoint": f"{provider_url}/itambox-e2e/authorize",
              "token_endpoint": f"{provider_url}/itambox-e2e/token",
              "userinfo_endpoint": f"{provider_url}/itambox-e2e/userinfo",
              "jwks_uri": f"{provider_url}/itambox-e2e/jwks",
          }
          discovery = json.loads(Path(os.environ["DISCOVERY_PATH"]).read_text(encoding="utf-8"))
          for key, value in expected.items():
              if discovery.get(key) != value:
                  raise SystemExit(f"OIDC discovery contract mismatch for {key}")

          jwks = json.loads(Path(os.environ["JWKS_PATH"]).read_text(encoding="utf-8"))
          if not any(
              key.get("kty") == "RSA"
              and key.get("use", "sig") == "sig"
              and key.get("alg", "RS256") == "RS256"
              for key in jwks.get("keys", [])
          ):
              raise SystemExit("OIDC JWKS has no RSA signing key usable for RS256")

          for key, value in expected.items():
              print(f"OIDC {key}: {value}")
          print("OIDC mock provider readiness passed; JWKS contains an RSA signing key usable for RS256.")
          PY

      - name: Run Django system checks
        working-directory: ./itambox
        run: uv run --locked --no-sync python manage.py check

      - name: Run migrations
        working-directory: ./itambox
        run: uv run --locked --no-sync python manage.py migrate

      - name: Generate ephemeral E2E credentials
        shell: bash
        run: |
          E2E_PASSWORD="$(python -c 'import secrets; print(secrets.token_urlsafe(32))')"
          echo "::add-mask::$E2E_PASSWORD"
          echo "E2E_PASSWORD=$E2E_PASSWORD" >> "$GITHUB_ENV"
          echo "DJANGO_SUPERUSER_PASSWORD=$E2E_PASSWORD" >> "$GITHUB_ENV"

      - name: Seed full E2E fixture data
        working-directory: ./itambox
        run: |
          # The existing browser suite exercises real assets, tenants, GraphQL,
          # HTMX, and SCIM flows, so the minimal production bootstrap is not enough.
          # This database is a disposable, job-local PostgreSQL service.
          uv run --locked --no-sync python manage.py seed_data --force

      - name: Provision E2E principal and SCIM token
        working-directory: ./itambox
        run: |
          uv run --locked --no-sync python manage.py shell <<'PY'
          import os

          from django.contrib.auth import get_user_model
          from django.db.models import Q
          from organization.models import AssetHolder, Membership, Role, Tenant
          from users.models import Token, UserGroup

          User = get_user_model()
          oidc_email = os.environ["E2E_OIDC_EMAIL"]
          user, _ = User.objects.get_or_create(
              username=os.environ["E2E_USERNAME"],
              defaults={"email": os.environ["DJANGO_SUPERUSER_EMAIL"]},
          )
          user.email = os.environ["DJANGO_SUPERUSER_EMAIL"]
          user.is_active = True
          user.is_staff = True
          user.is_superuser = True
          user.set_password(os.environ["E2E_PASSWORD"])
          user.save()

          tenant = Tenant._base_manager.get(
              slug=os.environ["E2E_TENANT_SLUG"],
              is_provider=False,
              deleted_at__isnull=True,
          )
          isolation_tenant, _ = Tenant._base_manager.get_or_create(
              slug=os.environ["E2E_ISOLATION_TENANT_SLUG"],
              defaults={"name": "E2E Isolation Tenant", "is_provider": False},
          )
          if isolation_tenant.is_provider or isolation_tenant.deleted_at is not None:
              raise RuntimeError("E2E isolation fixture tenant must be a live non-provider tenant")

          administrator_roles = Role.all_objects.filter(
              tenant=tenant,
              name="Administrator",
              deleted_at__isnull=True,
          )
          if administrator_roles.count() != 1:
              raise RuntimeError("E2E tenant must have exactly one live Administrator role")
          administrator = administrator_roles.get()
          admin_roles = Role.all_objects.filter(
              tenant=tenant,
              name="Admin",
              deleted_at__isnull=True,
          )
          if admin_roles.count() > 1:
              raise RuntimeError("E2E tenant must have at most one live Admin role")
          admin = admin_roles.first()
          if admin is None:
              Role.all_objects.create(
                  tenant=tenant,
                  name="Admin",
                  description="E2E OIDC mapped role.",
                  permissions=list(administrator.permissions or []),
              )
          else:
              admin.permissions = list(administrator.permissions or [])
              admin.save(update_fields=["permissions"])

          if User._base_manager.filter(email=oidc_email).exists():
              raise RuntimeError("E2E OIDC fixture User already exists")
          holder_match = AssetHolder.all_objects.filter(tenant=tenant).filter(
              Q(email=oidc_email) | Q(upn=oidc_email) | Q(user__email=oidc_email) | Q(user__username=oidc_email)
          )
          if holder_match.exists():
              raise RuntimeError("E2E OIDC fixture AssetHolder already exists")
          membership_match = Membership._base_manager.filter(tenant=tenant).filter(
              Q(user__email=oidc_email) | Q(user__username=oidc_email)
          )
          if membership_match.exists():
              raise RuntimeError("E2E OIDC fixture Membership already exists")
          print("E2E OIDC fixture absence and Admin-role preconditions passed.")

          UserGroup._base_manager.get_or_create(
              tenant=tenant,
              name=os.environ["E2E_TENANT_GROUP_NAME"],
          )
          Token.objects.filter(user=user, description="GitHub Actions E2E SCIM").delete()
          token = Token.objects.create(
              user=user,
              tenant=tenant,
              write_enabled=True,
              description="GitHub Actions E2E SCIM",
          )
          plaintext = token.key
          print(f"::add-mask::{plaintext}")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env_file:
              env_file.write(f"E2E_SCIM_TOKEN={plaintext}\n")
          PY

      - name: Start Django dev server
        working-directory: ./itambox
        run: |
          echo "Starting Django dev server on loopback port 8000..."
          # The redacted wrapper below executes: uv run --locked --no-sync python manage.py runserver 127.0.0.1:8000
          uv run --locked --no-sync python - <<'PY' &
          import re
          import runpy
          import sys

          from django.core.servers import basehttp

          original_log_message = basehttp.WSGIRequestHandler.log_message

          def redacted_log_message(self, format, *args):
              safe_args = tuple(
                  re.sub(r'([^\s"]+)\?[^\s"]*', r'\1', value) if isinstance(value, str) else value
                  for value in args
              )
              return original_log_message(self, format, *safe_args)

          basehttp.WSGIRequestHandler.log_message = redacted_log_message
          sys.argv = ["manage.py", "runserver", "127.0.0.1:8000", "--noreload"]
          runpy.run_path("manage.py", run_name="__main__")
          PY
          DJANGO_PID=$!
          echo "DJANGO_PID=$DJANGO_PID" >> "$GITHUB_ENV"
          django_ready=false
          for _ in $(seq 1 30); do
            if curl -s -o /dev/null -w "%{http_code}" http://localhost:8000/ | grep -q "200\|301\|302"; then
              django_ready=true
              break
            fi
            sleep 1
          done
          [[ ${django_ready} == true ]]
          echo "Django server ready."

      - name: Run E2E tests
        id: e2e
        working-directory: ./itambox/tests/e2e
        run: npm test
        timeout-minutes: 15

      - name: Run generated OpenAPI client smoke test
        if: always()
        working-directory: ./itambox
        run: npm run openapi-client-smoke && git diff --exit-code -- tests/openapi_client/schema.d.ts
        timeout-minutes: 5

      - name: Stop Django dev server
        if: always()
        working-directory: ./itambox
        run: |
          if [ -n "$DJANGO_PID" ]; then
            kill "$DJANGO_PID" 2>/dev/null || true
          fi
          # Fallback: kill any remaining runserver processes
          pkill -f "manage.py runserver" 2>/dev/null || true

      - name: Upload Playwright traces on failure
        if: failure() && steps.e2e.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-traces
          path: |
            itambox/tests/e2e/test-results/
            itambox/tests/e2e/playwright-report/
            itambox/tests/e2e/storageStateError.png
          if-no-files-found: warn
          retention-days: 7
